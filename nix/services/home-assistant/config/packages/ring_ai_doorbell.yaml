automation:
  - id: ring_front_door_ai_recording_frames_summary
    alias: "Ring: Front Door AI recording frames summary"
    mode: queued
    max: 5

    variables:
      recording_camera: camera.front_door_last_recording
      title: >-
        {% if trigger is defined and trigger.id == 'ding' %}
          🔔 Front Door
        {% else %}
          🚶 Front Door Motion
        {% endif %}

    triggers:
      - trigger: state
        id: ding
        entity_id: event.front_door_ding
        from: null

      - trigger: state
        id: motion
        entity_id: event.front_door_motion
        from: null

    actions:
      - variables:
          previous_video_id: "{{ state_attr(recording_camera, 'last_video_id') }}"

      - if:
          - condition: template
            value_template: "{{ trigger is defined }}"
        then:
          - wait_template: >-
              {{ state_attr(recording_camera, 'last_video_id') != previous_video_id
                 and state_attr(recording_camera, 'video_url') is string }}
            timeout: "00:03:00"
            continue_on_timeout: false

      - delay: "00:00:05"

      - variables:
          video_url: "{{ state_attr(recording_camera, 'video_url') }}"

      - condition: template
        value_template: "{{ video_url is string and video_url | length > 0 }}"

      - action: shell_command.extract_front_door_recording_frames
        data:
          video_url: "{{ video_url }}"

      - action: ai_task.generate_data
        data:
          entity_id: ai_task.google_ai_task
          task_name: front_door_recording_frames_summary
          instructions: >-
            These are four frames extracted from the latest Ring front door
            recording after a motion or doorbell event. Treat them as a timeline.
            Summarise the useful visible activity in under 30 words. Mention
            people, deliveries, parcels, vehicles, animals, or unusual activity.
            If nothing useful is visible, say so clearly.
          attachments:
            - media_content_id: media-source://media_source/local/doorbell/front_door_frame_01.jpg
              media_content_type: image/jpeg
            - media_content_id: media-source://media_source/local/doorbell/front_door_frame_02.jpg
              media_content_type: image/jpeg
            - media_content_id: media-source://media_source/local/doorbell/front_door_frame_03.jpg
              media_content_type: image/jpeg
            - media_content_id: media-source://media_source/local/doorbell/front_door_frame_04.jpg
              media_content_type: image/jpeg
        response_variable: ring_ai

      - variables:
          ai_summary: >-
            {{ ring_ai.data | default('Front door recording detected, but AI did not return a summary.', true) | trim }}

      - action: telegram_bot.send_photo
        data:
          chat_id:
            - -4936739997
          file: /media/doorbell/front_door_frame_02.jpg
          caption: |-
            {{ title | trim }}

            {{ ai_summary }}
          parse_mode: plain_text

